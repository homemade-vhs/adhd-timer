<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADHD Timer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Inter:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@300;400;700;800&family=Montserrat:wght@300;400;600;700;800;900&family=Nunito:wght@300;400;600;700;800;900&family=Orbitron:wght@400;600;700;800;900&family=Oswald:wght@300;400;600;700&family=Pacifico&family=Playfair+Display:wght@400;600;700;800;900&family=Poppins:wght@300;400;600;700;800;900&family=Righteous&family=Roboto+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <section id="content">
      <h1 id="title" class="txt"></h1>
      <h2 id="subtitle" class="txt"></h2>
      <div id="time" class="txt">25:00</div>
      <div id="remaining" class="txt"></div>
    </section>
    <div id="bar" class="bar">
      <div class="bar-track"><div class="bar-fill"></div></div>
    </div>
  </main>

  <div id="flash"></div>
  <div id="toast" class="glass">Time's up! Click anywhere or press any key to dismiss.</div>

  <div id="controls" class="glass">
    <div class="dur" title="Timer length">
      <input id="inH" type="number" min="0" max="99" inputmode="numeric" aria-label="Hours"><span>h</span>
      <input id="inM" type="number" min="0" max="59" inputmode="numeric" aria-label="Minutes"><span>m</span>
      <input id="inS" type="number" min="0" max="59" inputmode="numeric" aria-label="Seconds"><span>s</span>
    </div>
    <div class="presets">
      <button class="btn chip" data-min="5">5</button>
      <button class="btn chip" data-min="10">10</button>
      <button class="btn chip" data-min="15">15</button>
      <button class="btn chip" data-min="25">25</button>
      <button class="btn chip" data-min="45">45</button>
      <button class="btn chip" data-min="60">60</button>
    </div>
    <div class="group">
      <button id="btnMinus" class="btn" title="Remove 1 minute (−)">−1m</button>
      <button id="btnStart" class="btn primary" title="Start / pause (Space)">Start</button>
      <button id="btnPlus" class="btn" title="Add 1 minute (+)">+1m</button>
      <button id="btnReset" class="btn" title="Reset (R)">Reset</button>
    </div>
    <div class="group">
      <button id="btnFull" class="btn icon" title="Fullscreen (F)">⛶</button>
      <button id="btnSettings" class="btn icon" title="Customize (S)">⚙</button>
    </div>
  </div>

  <aside id="settings" class="glass" aria-label="Settings">
    <header class="set-head">
      <strong>Customize</strong>
      <button id="btnClose" class="btn icon" title="Close (Esc)">✕</button>
    </header>
    <div id="settingsBody" class="set-body"></div>
    <footer class="set-foot">
      <span class="hint">Space start/pause · R reset · F fullscreen · H hide controls · ± minute</span>
      <button id="btnDefaults" class="btn danger">Reset all settings</button>
    </footer>
  </aside>

  <script src="app.js"></script>
</body>
</html>
